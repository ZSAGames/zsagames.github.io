<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZSAGames — Zespół Szkół Akademickich w Łomży</title>
  <style>
    :root {
      --xmb-white: #f4f7ff;
      --xmb-dim: rgba(230, 238, 255, 0.48);
      --xmb-gold: #e6c15a;
      --cat-spacing: 138px;
      --item-spacing: 92px;
      --active-item-gap: 34px;
      --cross-x: 27vw;
      --cross-y: 36vh;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #061024;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--xmb-white);
      touch-action: none;
    }

    #xmb-wave-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .ps3-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 65% 42%, rgba(42, 98, 196, 0.16) 0%, transparent 60%),
        radial-gradient(circle at 50% 50%, transparent 55%, rgba(2, 5, 14, 0.72) 100%);
    }

    .top-bar {
      position: fixed;
      top: 26px;
      left: 38px;
      right: 38px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .zsa-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      text-decoration: none;
      color: var(--xmb-white);
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    .zsa-brand:hover {
      opacity: 1;
    }

    .zsa-crest {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      background: linear-gradient(145deg, #1b3b73, #0b1936);
      border: 1px solid rgba(230, 193, 90, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      color: var(--xmb-gold);
    }

    .zsa-brand-text {
      display: flex;
      flex-direction: column;
    }

    .zsa-brand-title {
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 1.4px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .zsa-brand-sub {
      font-size: 0.66rem;
      color: rgba(230, 238, 255, 0.65);
      letter-spacing: 0.8px;
    }

    .ps3-clock-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 5px 16px 5px 18px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 100%);
      border: 1px solid rgba(255, 255, 255, 0.24);
      font-size: 0.92rem;
      font-weight: 300;
      letter-spacing: 1.2px;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
    }

    .ps3-clock-spinner {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.6px solid rgba(255, 255, 255, 0.85);
      border-top-color: transparent;
      animation: ps3Spin 4s linear infinite;
    }

    @keyframes ps3Spin {
      to { transform: rotate(360deg); }
    }

    .xmb-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 10;
    }

    .xmb-categories-track {
      position: absolute;
      top: var(--cross-y);
      left: var(--cross-x);
      display: flex;
      align-items: center;
      will-change: transform;
      transition: transform 0.32s cubic-bezier(0.2, 0.85, 0.25, 1);
    }

    .xmb-category {
      width: var(--cat-spacing);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.42;
      transform: translate3d(0, 0, 0) scale(0.84);
      transition: opacity 0.26s ease, transform 0.28s cubic-bezier(0.2, 0.85, 0.25, 1);
    }

    .xmb-category.active {
      opacity: 1;
      transform: translate3d(0, -6px, 0) scale(1.08);
    }

    .cat-icon {
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.75));
    }

    .xmb-category.active .cat-icon {
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.75));
    }

    .cat-icon svg {
      width: 40px;
      height: 40px;
      stroke: currentColor;
      stroke-width: 1.6;
      fill: rgba(255, 255, 255, 0.12);
    }

    .cat-label {
      margin-top: 6px;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.6px;
      text-align: center;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.22s ease, transform 0.22s ease;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .xmb-category.active .cat-label {
      opacity: 1;
      transform: translateY(0);
    }

    .xmb-column {
      position: absolute;
      left: var(--cross-x);
      top: 0;
      width: 0;
      height: 100vh;
      pointer-events: none;
    }

    .xmb-item {
      position: absolute;
      left: 26px;
      top: 0;
      display: flex;
      align-items: center;
      gap: 20px;
      width: 460px;
      cursor: pointer;
      pointer-events: auto;
      will-change: transform, opacity;
      transition:
        transform 0.32s cubic-bezier(0.2, 0.85, 0.25, 1),
        opacity 0.26s ease;
    }

    .item-thumb-wrap {
      position: relative;
      width: 112px;
      height: 64px;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      background: #102042;
      border: 1.5px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.65);
      transition: transform 0.26s ease, border-color 0.26s ease, box-shadow 0.26s ease;
    }

    .item-thumb-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(165deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.04) 45%, transparent 50%);
      pointer-events: none;
    }

    .item-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .xmb-item.active .item-thumb-wrap {
      transform: scale(1.16);
      border-color: #ffffff;
      box-shadow:
        0 0 16px rgba(255, 255, 255, 0.65),
        0 8px 22px rgba(0, 0, 0, 0.8);
    }

    .item-meta {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.4px;
      color: var(--xmb-white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
      transition: font-size 0.22s ease;
    }

    .xmb-item.active .item-title {
      font-size: 1.28rem;
      font-weight: 500;
      color: #ffffff;
    }

    .item-sub {
      font-size: 0.78rem;
      color: rgba(220, 232, 255, 0.72);
      margin-top: 3px;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .info-side-card {
      position: fixed;
      left: calc(var(--cross-x) + 410px);
      top: calc(var(--cross-y) + 92px);
      width: 285px;
      padding: 14px 16px;
      border-radius: 8px;
      background: linear-gradient(160deg, rgba(16, 32, 66, 0.94) 0%, rgba(7, 15, 34, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.75);
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transform: translate3d(-10px, 0, 0);
      transition: opacity 0.24s ease, transform 0.24s ease;
    }

    .info-side-card.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate3d(0, 0, 0);
    }

    .info-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    .info-card-tag {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--xmb-gold);
      font-weight: 600;
    }

    .info-card-title {
      font-size: 0.96rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .info-card-desc {
      font-size: 0.8rem;
      line-height: 1.42;
      color: rgba(235, 242, 255, 0.86);
      margin-bottom: 12px;
    }

    .info-card-play {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: #ffffff;
      font-size: 0.76rem;
      letter-spacing: 0.6px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .info-card-play:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .mobile-controls {
      display: none;
    }

    body.is-mobile .mobile-controls {
      display: flex;
      position: fixed;
      bottom: 18px;
      left: 18px;
      right: 18px;
      z-index: 30;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }

    .touch-dpad, .touch-actions {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .touch-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(12, 26, 54, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .touch-btn.pill {
      width: auto;
      padding: 0 15px;
      border-radius: 22px;
      font-size: 0.78rem;
      letter-spacing: 0.6px;
    }

    @media (max-width: 900px) and (orientation: portrait) {
      :root {
        --cross-x: 18vw;
        --cross-y: 28vh;
        --cat-spacing: 105px;
        --item-spacing: 82px;
      }
      .top-bar { top: 16px; left: 18px; right: 18px; }
      .zsa-brand-sub { display: none; }
      .xmb-item { width: 74vw; }
      .item-thumb-wrap { width: 92px; height: 54px; }
      .info-side-card {
        left: 50%;
        top: auto;
        bottom: 84px;
        width: 88vw;
        max-width: 340px;
        transform: translate3d(-50%, 8px, 0);
      }
      .info-side-card.visible { transform: translate3d(-50%, 0, 0); }
    }

    @media (max-height: 540px) and (orientation: landscape) {
      :root {
        --cross-x: 22vw;
        --cross-y: 33vh;
        --cat-spacing: 112px;
        --item-spacing: 74px;
        --active-item-gap: 24px;
      }
      .top-bar { top: 12px; left: 22px; right: 22px; }
      .item-thumb-wrap { width: 88px; height: 50px; }
      .info-side-card { left: auto; right: 24px; top: calc(var(--cross-y) + 60px); width: 250px; }
    }
  </style>
</head>
<body>

  <canvas id="xmb-wave-canvas"></canvas>
  <div class="ps3-vignette"></div>

  <header class="top-bar">
    <a href="https://zsagames.github.io/" target="_self" rel="noopener" class="zsa-brand">
      <div class="zsa-crest"><img class="zsa-crest" src="https://avatars.githubusercontent.com/u/349516848?v=4" alt="ZSA"></div>
      <div class="zsa-brand-text">
        <span class="zsa-brand-title">ZSAGames</span>
        <span class="zsa-brand-sub">Zespół Szkół Akademickich w Łomży</span>
      </div>
    </a>

    <div class="ps3-clock-pill">
      <span id="ps3-datetime">05/11 21:00</span>
      <div class="ps3-clock-spinner"></div>
    </div>
  </header>

  <main class="xmb-viewport" id="xmb-viewport">
    <div class="xmb-categories-track" id="xmb-categories"></div>
    <div class="xmb-column" id="xmb-items"></div>

    <aside class="info-side-card" id="info-card">
      <div class="info-card-header">
        <span class="info-card-tag" id="info-card-tag">ZSAGames</span>
      </div>
      <div class="info-card-title" id="info-card-title"></div>
      <p class="info-card-desc" id="info-card-desc"></p>
      <a href="#" target="_blank" rel="noopener" class="info-card-play" id="info-card-link">
        <span>✕</span> Uruchom
      </a>
    </aside>
  </main>

  <div class="mobile-controls">
    <div class="touch-dpad">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-up">▲</button>
      <button class="touch-btn" id="btn-down">▼</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <div class="touch-actions">
      <button class="touch-btn pill" id="btn-info">△ Opis</button>
      <button class="touch-btn pill" id="btn-play">✕ Graj</button>
    </div>
  </div>

  <script>
    const GAMES_DATA = [
      {
        title: "Przygoda Dave'a",
        description: "Rozdział 1, 2 & 3: Pokonaj Fortecę Evada, zdobądź Ostrze Rdzeniowe w Dżungli, zinfiltruj Bazę Johna i przebij się z Raygunem przez Saharę oraz Góry Johna w 125 poziomach!",
        thumbnail: "PDCOVER.png",
        url: "https://zsagames.github.io/platformer"
      },
      {
        title: "RavenField Polska Edition",
        description: "Ravenfield to jednoosobowa, stylizowana strzelanka pierwszoosobowa (FPS), w której gracz wraz z drużyną sterowanych przez sztuczną inteligencję botów (Niebieskimi) walczy na różnorodnych mapach przeciwko drużynie przeciwnej (Czerwonym)",
        thumbnail: "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/636480/capsule_616x353.jpg?t=1791381747",
        url: "https://zsagames.github.io/ravenfield"
      }
    ];

    const XMB_CATEGORIES = [
      {
        id: "zsa",
        label: "ZSA Łomża",
        icon: `<svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V10z"/><path d="M9 22V12h6v10"/></svg>`,
        items: [
          {
            title: "Oficjalny Portal ZSA",
            subtitle: "zsa.mans.edu.pl",
            description: "Przejdź na oficjalną stronę Zespołu Szkół Akademickich w Łomży — aktualności, rekrutacja oraz kierunki kształcenia.",
            thumbnail: "ZSACover.png",
            url: "https://zsa.mans.edu.pl"
          }
        ]
      },
      {
        id: "games",
        label: "Gry",
        icon: `<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="6"/><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/></svg>`,
        items: GAMES_DATA.map((g, idx) => ({
          ...g,
          subtitle: `Projekt #${idx + 1} • ZSAGames`
        }))
      },
      {
        id: "leaderboards",
        label: "Rankingi",
        icon: `<svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>`,
        items: [
          {
            title: "Leaderboards",
            subtitle: "Sieciowa tablica wyników",
            description: "Globalny ranking naszych gier zintegrowany z API LootLocker.",
            thumbnail: "LCover.png",
            url: "https://zsagames.github.io/leaderboards"
          }
        ]
      }
    ];

    function detectRealMobile() {
      const uaMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const coarsePointer = window.matchMedia("(pointer: coarse) and (hover: none)").matches;
      if (uaMobile && coarsePointer) {
        document.body.classList.add("is-mobile");
      } else {
        document.body.classList.remove("is-mobile");
      }
    }
    detectRealMobile();

    let audioCtx = null;
    function playXmbClick(freq = 1480) {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.65, audioCtx.currentTime + 0.045);
        gain.gain.setValueAtTime(0.055, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.045);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.048);
      } catch (_) {}
    }

    let activeCatIndex = 1;
    let activeItemIndex = 0;
    let infoTimer = null;

    const catTrackEl = document.getElementById("xmb-categories");
    const itemsColEl = document.getElementById("xmb-items");
    const infoCardEl = document.getElementById("info-card");
    const infoTitleEl = document.getElementById("info-card-title");
    const infoDescEl = document.getElementById("info-card-desc");
    const infoTagEl = document.getElementById("info-card-tag");
    const infoLinkEl = document.getElementById("info-card-link");

    function getCssSpacing(varName, fallback) {
      const val = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(varName));
      return Number.isFinite(val) ? val : fallback;
    }

    function hideInfoCard() {
      clearTimeout(infoTimer);
      infoCardEl.classList.remove("visible");
    }

    function showInfoCardForCurrent() {
      const item = XMB_CATEGORIES[activeCatIndex].items[activeItemIndex];
      if (!item) return;
      infoTagEl.textContent = XMB_CATEGORIES[activeCatIndex].label;
      infoTitleEl.textContent = item.title;
      infoDescEl.textContent = item.description;
      infoLinkEl.href = item.url;
      infoCardEl.classList.add("visible");
    }

    function scheduleInfoCard(delay = 850) {
      hideInfoCard();
      infoTimer = setTimeout(() => {
        showInfoCardForCurrent();
      }, delay);
    }

    function buildCategories() {
      catTrackEl.innerHTML = "";
      XMB_CATEGORIES.forEach((cat, idx) => {
        const el = document.createElement("div");
        el.className = "xmb-category" + (idx === activeCatIndex ? " active" : "");
        el.innerHTML = `<div class="cat-icon">${cat.icon}</div><div class="cat-label">${cat.label}</div>`;
        el.addEventListener("click", () => {
          if (activeCatIndex !== idx) selectCategory(idx);
        });
        catTrackEl.appendChild(el);
      });
    }

    function buildItems() {
      itemsColEl.innerHTML = "";
      const items = XMB_CATEGORIES[activeCatIndex].items;
      items.forEach((item, idx) => {
        const el = document.createElement("div");
        el.className = "xmb-item" + (idx === activeItemIndex ? " active" : "");
        el.innerHTML = `
          <div class="item-thumb-wrap">
            <img class="item-thumb" src="${item.thumbnail}" alt="${item.title}" loading="lazy" />
          </div>
          <div class="item-meta">
            <div class="item-title">${item.title}</div>
            <div class="item-sub">${item.subtitle || ""}</div>
          </div>
        `;
        el.addEventListener("click", () => {
          if (activeItemIndex !== idx) selectItem(idx);
          else window.open(item.url, "_self", "noopener");
        });
        itemsColEl.appendChild(el);
      });
      layoutXmb();
      scheduleInfoCard(850);
    }

    function layoutXmb() {
      const catSpacing = getCssSpacing("--cat-spacing", 138);
      const itemSpacing = getCssSpacing("--item-spacing", 92);
      const activeGap = getCssSpacing("--active-item-gap", 34);
      const crossY = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cross-y")) / 100) * window.innerHeight || window.innerHeight * 0.36;

      const offsetX = -activeCatIndex * catSpacing;
      catTrackEl.style.transform = `translate3d(${offsetX}px, 0, 0)`;

      Array.from(catTrackEl.children).forEach((el, idx) => {
        el.classList.toggle("active", idx === activeCatIndex);
      });

      Array.from(itemsColEl.children).forEach((el, idx) => {
        const diff = idx - activeItemIndex;
        let yPos;
        if (diff === 0) yPos = crossY + 86;
        else if (diff < 0) yPos = crossY - 76 + diff * (itemSpacing * 0.85);
        else yPos = crossY + 86 + activeGap + diff * itemSpacing;

        const distance = Math.abs(diff);
        const opacity = diff === 0 ? 1 : Math.max(0.15, 0.72 - distance * 0.16);
        const scale = diff === 0 ? 1 : 0.88;

        el.classList.toggle("active", diff === 0);
        el.style.transform = `translate3d(0, ${Math.round(yPos)}px, 0) scale(${scale})`;
        el.style.opacity = opacity;
      });
    }

    function selectCategory(newIndex) {
      const clamped = Math.max(0, Math.min(XMB_CATEGORIES.length - 1, newIndex));
      if (clamped === activeCatIndex) return;
      hideInfoCard();
      activeCatIndex = clamped;
      activeItemIndex = 0;
      playXmbClick(1620);
      buildItems();
    }

    function selectItem(newIndex) {
      const list = XMB_CATEGORIES[activeCatIndex].items;
      const clamped = Math.max(0, Math.min(list.length - 1, newIndex));
      if (clamped === activeItemIndex) return;
      hideInfoCard();
      activeItemIndex = clamped;
      playXmbClick(1420);
      layoutXmb();
      scheduleInfoCard(850);
    }

    function launchCurrentItem() {
      const item = XMB_CATEGORIES[activeCatIndex].items[activeItemIndex];
      if (item && item.url) {
        playXmbClick(1850);
        window.open(item.url, "_blank", "noopener");
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
        e.preventDefault(); selectCategory(activeCatIndex - 1);
      } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
        e.preventDefault(); selectCategory(activeCatIndex + 1);
      } else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") {
        e.preventDefault(); selectItem(activeItemIndex - 1);
      } else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") {
        e.preventDefault(); selectItem(activeItemIndex + 1);
      } else if (e.key === "Enter") {
        e.preventDefault(); launchCurrentItem();
      } else if (e.key === "i" || e.key === "I") {
        if (infoCardEl.classList.contains("visible")) hideInfoCard();
        else showInfoCardForCurrent();
      }
    });

    let lastWheelTime = 0;
    window.addEventListener("wheel", (e) => {
      const now = performance.now();
      if (now - lastWheelTime < 170) return;
      if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        const delta = e.deltaX !== 0 ? e.deltaX : e.deltaY;
        if (Math.abs(delta) > 10) {
          lastWheelTime = now;
          selectCategory(activeCatIndex + (delta > 0 ? 1 : -1));
        }
      } else if (Math.abs(e.deltaY) > 10) {
        lastWheelTime = now;
        selectItem(activeItemIndex + (e.deltaY > 0 ? 1 : -1));
      }
    }, { passive: true });

    let touchStartX = 0;
    let touchStartY = 0;
    window.addEventListener("touchstart", (e) => {
      if (!e.touches.length) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener("touchend", (e) => {
      if (!e.changedTouches.length) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) < 36 && Math.abs(dy) < 36) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        selectCategory(activeCatIndex + (dx < 0 ? 1 : -1));
      } else {
        selectItem(activeItemIndex + (dy < 0 ? 1 : -1));
      }
    }, { passive: true });

    document.getElementById("btn-left").addEventListener("click", () => selectCategory(activeCatIndex - 1));
    document.getElementById("btn-right").addEventListener("click", () => selectCategory(activeCatIndex + 1));
    document.getElementById("btn-up").addEventListener("click", () => selectItem(activeItemIndex - 1));
    document.getElementById("btn-down").addEventListener("click", () => selectItem(activeItemIndex + 1));
    document.getElementById("btn-play").addEventListener("click", () => launchCurrentItem());
    document.getElementById("btn-info").addEventListener("click", () => {
      if (infoCardEl.classList.contains("visible")) hideInfoCard();
      else showInfoCardForCurrent();
    });

    let lastPadTime = 0;
    function pollGamepad(now) {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      const pad = pads[0] || pads[1] || pads[2] || pads[3];
      if (pad && now - lastPadTime > 190) {
        const axX = pad.axes[0] || 0;
        const axY = pad.axes[1] || 0;
        const up = pad.buttons[12]?.pressed || axY < -0.55;
        const down = pad.buttons[13]?.pressed || axY > 0.55;
        const left = pad.buttons[14]?.pressed || axX < -0.55;
        const right = pad.buttons[15]?.pressed || axX > 0.55;
        const crossBtn = pad.buttons[0]?.pressed;
        const triangleBtn = pad.buttons[3]?.pressed;

        if (left) { lastPadTime = now; selectCategory(activeCatIndex - 1); }
        else if (right) { lastPadTime = now; selectCategory(activeCatIndex + 1); }
        else if (up) { lastPadTime = now; selectItem(activeItemIndex - 1); }
        else if (down) { lastPadTime = now; selectItem(activeItemIndex + 1); }
        else if (crossBtn) { lastPadTime = now + 150; launchCurrentItem(); }
        else if (triangleBtn) {
          lastPadTime = now + 150;
          if (infoCardEl.classList.contains("visible")) hideInfoCard();
          else showInfoCardForCurrent();
        }
      }
    }

    const clockEl = document.getElementById("ps3-datetime");
    function updateClock() {
      const d = new Date();
      const day = String(d.getDate()).padStart(2, "0");
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const hours = String(d.getHours()).padStart(2, "0");
      const mins = String(d.getMinutes()).padStart(2, "0");
      clockEl.textContent = `${day}/${month} ${hours}:${mins}`;
    }
    updateClock();
    setInterval(updateClock, 15000);

    const canvas = document.getElementById("xmb-wave-canvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const RENDER_SCALE = 0.6;
    let cw = 0, ch = 0;

    const sparkles = Array.from({ length: 18 }, () => ({
      x: Math.random(),
      y: 0.35 + Math.random() * 0.35,
      r: 0.9 + Math.random() * 1.4,
      speed: 0.00018 + Math.random() * 0.00025,
      phase: Math.random() * Math.PI * 2
    }));

    function resizeCanvas() {
      cw = Math.max(320, Math.floor(window.innerWidth * RENDER_SCALE));
      ch = Math.max(200, Math.floor(window.innerHeight * RENDER_SCALE));
      canvas.width = cw;
      canvas.height = ch;
      layoutXmb();
    }
    window.addEventListener("resize", resizeCanvas);

    function drawPs3Wave(time) {
      const bgGrad = ctx.createLinearGradient(0, 0, cw, ch);
      bgGrad.addColorStop(0, "#050d20");
      bgGrad.addColorStop(0.5, "#0d234a");
      bgGrad.addColorStop(1, "#040917");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, cw, ch);

      const t = time * 0.00045;
      const step = 14;

      for (let w = 0; w < 2; w++) {
        ctx.beginPath();
        const baseY = ch * (0.52 + w * 0.045);
        const amp1 = ch * (0.065 - w * 0.015);
        const amp2 = ch * 0.03;

        for (let x = 0; x <= cw + step; x += step) {
          const nx = x / cw;
          const y = baseY + Math.sin(nx * 4.2 + t + w * 1.1) * amp1 + Math.cos(nx * 2.3 - t * 0.8 + w) * amp2;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        for (let x = cw + step; x >= 0; x -= step) {
          const nx = x / cw;
          const y = baseY + ch * 0.085 + Math.sin(nx * 3.6 - t * 0.65 + w) * (amp1 * 0.75);
          ctx.lineTo(x, y);
        }
        ctx.closePath();

        const waveGrad = ctx.createLinearGradient(0, baseY - amp1, 0, baseY + ch * 0.1);
        waveGrad.addColorStop(0, w === 0 ? "rgba(210, 230, 255, 0.20)" : "rgba(150, 195, 255, 0.13)");
        waveGrad.addColorStop(1, "rgba(15, 45, 95, 0.0)");
        ctx.fillStyle = waveGrad;
        ctx.fill();

        ctx.beginPath();
        for (let x = 0; x <= cw + step; x += step) {
          const nx = x / cw;
          const y = baseY + Math.sin(nx * 4.2 + t + w * 1.1) * amp1 + Math.cos(nx * 2.3 - t * 0.8 + w) * amp2;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = w === 0 ? "rgba(255, 255, 255, 0.36)" : "rgba(200, 225, 255, 0.18)";
        ctx.lineWidth = 1.1;
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
      for (let i = 0; i < sparkles.length; i++) {
        const s = sparkles[i];
        s.x += s.speed;
        if (s.x > 1.02) s.x = -0.02;
        const py = (s.y + Math.sin(t * 2 + s.phase) * 0.02) * ch;
        ctx.beginPath();
        ctx.arc(s.x * cw, py, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    let lastFrameTime = 0;
    function mainLoop(now) {
      pollGamepad(now);
      if (!document.hidden && now - lastFrameTime >= 32) {
        lastFrameTime = now;
        drawPs3Wave(now);
      }
      requestAnimationFrame(mainLoop);
    }

    buildCategories();
    buildItems();
    resizeCanvas();
    requestAnimationFrame(mainLoop);
  </script>
</body>
</html>
